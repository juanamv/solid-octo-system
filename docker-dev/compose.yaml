name: sales-dev

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mercatech_db}
      MYSQL_USER: ${DB_USERNAME:-sales}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Ejecuta primero ./setup.ps1}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Ejecuta primero ./setup.ps1}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [sales]

  api:
    build: ./api
    working_dir: /app
    environment:
      APP_NAME: Sales
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?Ejecuta primero ./setup.ps1}
      APP_URL: http://localhost:${API_PORT:-8000}
      DB_CONNECTION: mysql
      DB_URL: ""
      DB_SOCKET: ""
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-mercatech_db}
      DB_USERNAME: ${DB_USERNAME:-sales}
      DB_PASSWORD: ${DB_PASSWORD:?Ejecuta primero ./setup.ps1}
      LOG_CHANNEL: stderr
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      COMPOSER_ALLOW_SUPERUSER: "1"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../api-sales:/app
      - api-vendor:/app/vendor
      - api-storage:/app/storage
      - api-cache:/app/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/products') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks: [sales]

  frontend:
    build: ./frontend
    working_dir: /app
    environment:
      NG_CLI_ANALYTICS: "false"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ../app-sales:/app
      - frontend-modules:/app/node_modules
      - frontend-cache:/app/.angular
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4200/',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    networks: [sales]

networks:
  sales:

volumes:
  mysql-data:
  api-vendor:
  api-storage:
  api-cache:
  frontend-modules:
  frontend-cache:
